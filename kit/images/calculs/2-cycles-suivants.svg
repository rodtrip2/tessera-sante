<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cycles suivants et délai de sept jours"><title>Cycles suivants et délai de sept jours</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="900" height="900" fill="#ffffff"/><rect x="120.0" y="15.0" width="360" height="50" rx="14" fill="#ffffff" stroke="#1f5f5b" stroke-width="1.6"/><text x="300.0" y="36.4" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">Décision du juge du cycle n</text><text x="300.0" y="52.7" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">(date et heure de l’ordonnance)</text><polygon points="300,110.0 430.0,160 300,210.0 170.0,160" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="164.6" font-size="13" text-anchor="middle" fill="#3d2a00">Maintien ?</text><path d="M300.0,65.0 L300.0,110.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="540.0" y="95.0" width="320" height="130" rx="4" fill="#fbebeb" stroke="#a3261e" stroke-width="1.6"/><text x="700.0" y="123.9" font-size="13" text-anchor="middle" fill="#5c120d" font-weight="700">Mainlevée : indicateur légal ;</text><text x="700.0" y="140.2" font-size="13" text-anchor="middle" fill="#5c120d">la mesure continue jusqu’à la fin</text><text x="700.0" y="156.4" font-size="13" text-anchor="middle" fill="#5c120d">décidée par le psychiatre ;</text><text x="700.0" y="172.7" font-size="13" text-anchor="middle" fill="#5c120d">nouvelle mesure dans les 48 h :</text><text x="700.0" y="188.9" font-size="13" text-anchor="middle" fill="#5c120d">information du juge sans délai ;</text><text x="700.0" y="205.2" font-size="13" text-anchor="middle" fill="#5c120d">après la fin, le cumul repart de zéro</text><path d="M430.0,160.0 L540.0,160.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="485.0" y="155.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><polygon points="300,255.0 460.0,310 300,365.0 140.0,310" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="306.4" font-size="13" text-anchor="middle" fill="#3d2a00">Isolement et cycle n + 1</text><text x="300.0" y="322.7" font-size="13" text-anchor="middle" fill="#3d2a00">au moins égal à 3 ?</text><path d="M300.0,210.0 L300.0,255.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="236.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><rect x="540.0" y="260.0" width="320" height="100" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="700.0" y="290.2" font-size="13" text-anchor="middle" fill="#1d2320">Cycle n + 1 = cycle 1</text><text x="700.0" y="306.4" font-size="13" text-anchor="middle" fill="#1d2320">+ n × intervalle</text><text x="700.0" y="322.7" font-size="13" text-anchor="middle" fill="#1d2320">isolement 96 h, contention 72 h</text><text x="700.0" y="338.9" font-size="13" text-anchor="middle" fill="#1d2320">(information, saisine, décision)</text><path d="M460.0,310.0 L540.0,310.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="500.0" y="305.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><rect x="80.0" y="420.0" width="440" height="120" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="300.0" y="452.1" font-size="13" text-anchor="middle" fill="#1d2320" font-weight="700">Rythme des mesures longues (isolement)</text><text x="300.0" y="468.3" font-size="13" text-anchor="middle" fill="#1d2320">base = décision du cycle 1 + 96 h</text><text x="300.0" y="484.6" font-size="13" text-anchor="middle" fill="#1d2320">+ (n + 1 − 3) × 168 h</text><text x="300.0" y="500.8" font-size="13" text-anchor="middle" fill="#1d2320">information et saisine = base + 144 h</text><text x="300.0" y="517.0" font-size="13" text-anchor="middle" fill="#1d2320">décision = base + 168 h</text><path d="M300.0,365.0 L300.0,420.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="396.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><polygon points="300,585.0 470.0,640 300,695.0 130.0,640" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="628.3" font-size="13" text-anchor="middle" fill="#3d2a00">Méthode recommandée</text><text x="300.0" y="644.5" font-size="13" text-anchor="middle" fill="#3d2a00">(délai de sept jours</text><text x="300.0" y="660.8" font-size="13" text-anchor="middle" fill="#3d2a00">depuis la décision) ?</text><path d="M300.0,540.0 L300.0,585.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="540.0" y="575.0" width="320" height="130" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="603.9" font-size="13" text-anchor="middle" fill="#37403c">Aussi compté depuis la décision</text><text x="700.0" y="620.2" font-size="13" text-anchor="middle" fill="#37403c">précédente : saisine au plus tard</text><text x="700.0" y="636.4" font-size="13" text-anchor="middle" fill="#37403c">144 h après, décision 168 h après ;</text><text x="700.0" y="652.7" font-size="13" text-anchor="middle" fill="#37403c" font-weight="700">échéance la plus proche retenue ;</text><text x="700.0" y="668.9" font-size="13" text-anchor="middle" fill="#37403c">décision non saisie : calcul depuis</text><text x="700.0" y="685.2" font-size="13" text-anchor="middle" fill="#37403c">le début et avertissement</text><path d="M470.0,640.0 L540.0,640.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="505.0" y="635.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="140.0" y="743.0" width="320" height="64" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="300.0" y="771.4" font-size="13" text-anchor="middle" fill="#37403c">Depuis le début de la mesure</text><text x="300.0" y="787.7" font-size="13" text-anchor="middle" fill="#37403c">seulement (méthode au choix)</text><path d="M300.0,695.0 L300.0,743.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="723.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><rect x="540.0" y="832.0" width="320" height="56" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="700.0" y="864.5" font-size="13" text-anchor="middle" fill="#123d24" font-weight="700">Échéances du cycle n + 1</text><path d="M700.0,705.0 L700.0,832.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><path d="M460.0,775.0 L580.0,775.0 L580.0,832.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><path d="M860.0,310.0 L870.0,310.0 L870.0,860.0 L860.0,860.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/></svg>
