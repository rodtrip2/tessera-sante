<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1020" width="940" height="1020" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Inscription d’une mesure au registre"><title>Inscription d’une mesure au registre</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="940" height="1020" fill="#ffffff"/><rect x="190.0" y="13.0" width="520" height="64" rx="14" fill="#ffffff" stroke="#1f5f5b" stroke-width="1.6"/><text x="450.0" y="41.4" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">Mesure (en cours ou terminée), période passée dans un service</text><text x="450.0" y="57.7" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">(un transfert ou des soins somatiques la découpent par service)</text><rect x="170.0" y="117.0" width="560" height="96" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="450.0" y="145.2" font-size="13" text-anchor="middle" fill="#1d2320" font-weight="700">Retirer les pauses</text><text x="450.0" y="161.4" font-size="13" text-anchor="middle" fill="#1d2320">chaque pause arrête la mesure au sens du registre ;</text><text x="450.0" y="177.7" font-size="13" text-anchor="middle" fill="#1d2320">chaque période active (du début ou d’une reprise</text><text x="450.0" y="193.9" font-size="13" text-anchor="middle" fill="#1d2320">à une pause, un arrêt ou la fin) est inscrite séparément</text><path d="M450.0,77.0 L450.0,117.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="450,245.0 580.0,295 450,345.0 320.0,295" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="450.0" y="299.6" font-size="13" text-anchor="middle" fill="#3d2a00">Contention ?</text><path d="M450.0,213.0 L450.0,245.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="690,370.0 810.0,420 690,470.0 570.0,420" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="690.0" y="424.6" font-size="13" text-anchor="middle" fill="#3d2a00">En CSI ?</text><path d="M580.0,295.0 L690.0,295.0 L690.0,370.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="635.0" y="290.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="795.0" y="517.0" width="130" height="66" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="860.0" y="539.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">C</text><text x="860.0" y="554.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">contention</text><text x="860.0" y="569.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">en CSI</text><path d="M810.0,420.0 L860.0,420.0 L860.0,517.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="835.0" y="415.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><polygon points="620,520.0 730.0,570 620,620.0 510.0,570" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="620.0" y="566.4" font-size="13" text-anchor="middle" fill="#3d2a00">Exception</text><text x="620.0" y="582.7" font-size="13" text-anchor="middle" fill="#3d2a00">prévue ?</text><path d="M690.0,470.0 L690.0,495.0 L620.0,495.0 L620.0,520.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="698.0" y="486.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><rect x="705.0" y="670.0" width="170" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="790.0" y="694.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">E</text><text x="790.0" y="709.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors espace</text><text x="790.0" y="724.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement, exception</text><rect x="475.0" y="670.0" width="170" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="560.0" y="694.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">D</text><text x="560.0" y="709.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors espace</text><text x="560.0" y="724.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement</text><path d="M730.0,570.0 L790.0,570.0 L790.0,670.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="760.0" y="565.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><path d="M620.0,620.0 L620.0,650.0 L560.0,650.0 L560.0,670.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="628.0" y="639.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><polygon points="200,370.0 320.0,420 200,470.0 80.0,420" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="200.0" y="424.6" font-size="13" text-anchor="middle" fill="#3d2a00">En CSI ?</text><path d="M320.0,295.0 L200.0,295.0 L200.0,370.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="278.0" y="290.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non (isolement)</text><rect x="5.0" y="517.0" width="110" height="66" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="60.0" y="546.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">B</text><text x="60.0" y="561.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors CSI</text><path d="M80.0,420.0 L60.0,420.0 L60.0,517.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="70.0" y="415.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><rect x="125.0" y="525.0" width="320" height="110" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="285.0" y="560.2" font-size="13" text-anchor="middle" fill="#1d2320">Retirer les périodes actives de</text><text x="285.0" y="576.4" font-size="13" text-anchor="middle" fill="#1d2320">contention en CSI (entrées C) ;</text><text x="285.0" y="592.7" font-size="13" text-anchor="middle" fill="#1d2320">une pause de la contention seule</text><text x="285.0" y="608.9" font-size="13" text-anchor="middle" fill="#1d2320">reste donc de l’isolement</text><path d="M200.0,470.0 L200.0,498.0 L285.0,498.0 L285.0,525.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="208.0" y="488.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><rect x="135.0" y="718.0" width="300" height="64" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="285.0" y="746.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">A : une entrée par portion</text><text x="285.0" y="761.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement en CSI restante</text><path d="M285.0,635.0 L285.0,718.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="530.0" y="835.0" width="380" height="170" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="720.0" y="879.2" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">Numérotation</text><text x="720.0" y="894.2" font-size="12" text-anchor="middle" fill="#37403c">commune A à E, dans l’ordre d’apparition</text><text x="720.0" y="909.2" font-size="12" text-anchor="middle" fill="#37403c">(débuts), dès le début de l’entrée, à la suite</text><text x="720.0" y="924.2" font-size="12" text-anchor="middle" fill="#37403c">du compteur du service ; année = année</text><text x="720.0" y="939.2" font-size="12" text-anchor="middle" fill="#37403c">du début de l’entrée.</text><text x="720.0" y="954.2" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">Durée</text><text x="720.0" y="969.2" font-size="12" text-anchor="middle" fill="#37403c">réelle, celle de la période.</text><rect x="50.0" y="855.0" width="380" height="130" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="240.0" y="901.7" font-size="12" text-anchor="middle" fill="#37403c">Exemple : isolement et contention</text><text x="240.0" y="916.7" font-size="12" text-anchor="middle" fill="#37403c">de 10 h à 18 h, contention arrêtée</text><text x="240.0" y="931.7" font-size="12" text-anchor="middle" fill="#37403c">de 12 h à 13 h :</text><text x="240.0" y="946.7" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">C1 10 h – 12 h · A2 12 h – 13 h · C3 13 h – 18 h</text></svg>
