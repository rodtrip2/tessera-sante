<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 960" width="940" height="960" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Inscription d’une mesure au registre"><title>Inscription d’une mesure au registre</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="940" height="960" fill="#ffffff"/><rect x="190.0" y="13.0" width="520" height="64" rx="14" fill="#ffffff" stroke="#1f5f5b" stroke-width="1.6"/><text x="450.0" y="41.4" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">Mesure (en cours ou terminée), période passée dans un service</text><text x="450.0" y="57.7" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">(un transfert ou des soins somatiques la découpent par service)</text><polygon points="450,125.0 580.0,175 450,225.0 320.0,175" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="450.0" y="179.6" font-size="13" text-anchor="middle" fill="#3d2a00">Contention ?</text><path d="M450.0,77.0 L450.0,125.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="690,250.0 810.0,300 690,350.0 570.0,300" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="690.0" y="304.6" font-size="13" text-anchor="middle" fill="#3d2a00">En CSI ?</text><path d="M580.0,175.0 L690.0,175.0 L690.0,250.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="635.0" y="170.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="795.0" y="397.0" width="130" height="66" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="860.0" y="419.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">C</text><text x="860.0" y="434.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">contention</text><text x="860.0" y="449.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">en CSI</text><path d="M810.0,300.0 L860.0,300.0 L860.0,397.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="835.0" y="295.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><polygon points="620,400.0 730.0,450 620,500.0 510.0,450" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="620.0" y="446.4" font-size="13" text-anchor="middle" fill="#3d2a00">Exception</text><text x="620.0" y="462.7" font-size="13" text-anchor="middle" fill="#3d2a00">prévue ?</text><path d="M690.0,350.0 L690.0,375.0 L620.0,375.0 L620.0,400.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="698.0" y="366.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><rect x="705.0" y="550.0" width="170" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="790.0" y="574.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">E</text><text x="790.0" y="589.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors espace</text><text x="790.0" y="604.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement, exception</text><rect x="475.0" y="550.0" width="170" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="560.0" y="574.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">D</text><text x="560.0" y="589.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors espace</text><text x="560.0" y="604.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement</text><path d="M730.0,450.0 L790.0,450.0 L790.0,550.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="760.0" y="445.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><path d="M620.0,500.0 L620.0,530.0 L560.0,530.0 L560.0,550.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="628.0" y="519.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><polygon points="200,250.0 320.0,300 200,350.0 80.0,300" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="200.0" y="304.6" font-size="13" text-anchor="middle" fill="#3d2a00">En CSI ?</text><path d="M320.0,175.0 L200.0,175.0 L200.0,250.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="278.0" y="170.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non (isolement)</text><rect x="5.0" y="397.0" width="110" height="66" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="60.0" y="426.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">B</text><text x="60.0" y="441.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">hors CSI</text><path d="M80.0,300.0 L60.0,300.0 L60.0,397.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="70.0" y="295.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><rect x="110.0" y="404.0" width="300" height="82" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="260.0" y="433.3" font-size="13" text-anchor="middle" fill="#1d2320">Retirer les périodes où le patient</text><text x="260.0" y="449.6" font-size="13" text-anchor="middle" fill="#1d2320">est sous contention en CSI</text><text x="260.0" y="465.8" font-size="13" text-anchor="middle" fill="#1d2320">(elles forment les entrées C)</text><path d="M200.0,350.0 L200.0,378.0 L260.0,378.0 L260.0,404.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="208.0" y="368.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><polygon points="260,540.0 430.0,610 260,680.0 90.0,610" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="260.0" y="599.2" font-size="12" text-anchor="middle" fill="#3d2a00">Pauses déduites partout</text><text x="260.0" y="614.2" font-size="12" text-anchor="middle" fill="#3d2a00">et pause de la contention seule</text><text x="260.0" y="629.2" font-size="12" text-anchor="middle" fill="#3d2a00">« en isolement seul » ?</text><path d="M260.0,486.0 L260.0,540.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="100.0" y="724.0" width="320" height="82" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="260.0" y="753.3" font-size="13" text-anchor="middle" fill="#37403c">Les pauses de la contention pendant</text><text x="260.0" y="769.5" font-size="13" text-anchor="middle" fill="#37403c">lesquelles l’isolement continue</text><text x="260.0" y="785.8" font-size="13" text-anchor="middle" fill="#37403c">redeviennent de l’isolement (A)</text><path d="M260.0,680.0 L260.0,724.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="268.0" y="706.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><rect x="110.0" y="868.0" width="300" height="64" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="260.0" y="896.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">A : une entrée par portion</text><text x="260.0" y="911.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">d’isolement en CSI restante</text><path d="M260.0,806.0 L260.0,868.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><path d="M90.0,610.0 L60.0,610.0 L60.0,900.0 L110.0,900.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="75.0" y="605.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><rect x="540.0" y="710.0" width="360" height="210" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="720.0" y="759.2" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">Numérotation commune A à E,</text><text x="720.0" y="774.2" font-size="12" text-anchor="middle" fill="#37403c">dans l’ordre des fins, à la suite du</text><text x="720.0" y="789.2" font-size="12" text-anchor="middle" fill="#37403c">compteur du service ; année = année</text><text x="720.0" y="804.2" font-size="12" text-anchor="middle" fill="#37403c">du début de l’entrée ; une entrée en</text><text x="720.0" y="819.2" font-size="12" text-anchor="middle" fill="#37403c">cours n’a pas de numéro.</text><text x="720.0" y="834.2" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">Durée : réelle, ou hors pauses si</text><text x="720.0" y="849.2" font-size="12" text-anchor="middle" fill="#37403c">elles sont déduites partout (pour C,</text><text x="720.0" y="864.2" font-size="12" text-anchor="middle" fill="#37403c">option « dans l’entrée C » : seule la</text><text x="720.0" y="879.2" font-size="12" text-anchor="middle" fill="#37403c">pause commune est déduite).</text></svg>
