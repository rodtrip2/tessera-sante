<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Levée temporaire (pause) d’une mesure"><title>Levée temporaire (pause) d’une mesure</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="900" height="1080" fill="#ffffff"/><rect x="110.0" y="15.0" width="380" height="50" rx="14" fill="#ffffff" stroke="#1f5f5b" stroke-width="1.6"/><text x="300.0" y="36.4" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">Le psychiatre décide une levée temporaire</text><text x="300.0" y="52.7" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">(pause), avec une reprise prévue</text><polygon points="300,110.0 460.0,165 300,220.0 140.0,165" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="153.3" font-size="13" text-anchor="middle" fill="#3d2a00">Durée prévue inférieure</text><text x="300.0" y="169.6" font-size="13" text-anchor="middle" fill="#3d2a00">au seuil de refus ?</text><text x="300.0" y="185.8" font-size="13" text-anchor="middle" fill="#3d2a00">(48 h au plus)</text><path d="M300.0,65.0 L300.0,110.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="124.0" width="300" height="82" rx="4" fill="#fbebeb" stroke="#a3261e" stroke-width="1.6"/><text x="700.0" y="153.3" font-size="13" text-anchor="middle" fill="#5c120d">Ce n’est pas une pause :</text><text x="700.0" y="169.6" font-size="13" text-anchor="middle" fill="#5c120d" font-weight="700">saisir la fin de la mesure</text><text x="700.0" y="185.8" font-size="13" text-anchor="middle" fill="#5c120d">(alerte dès 12 h, réglable)</text><path d="M460.0,165.0 L550.0,165.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="505.0" y="160.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><polygon points="300,260.0 470.0,320 300,380.0 130.0,320" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="316.4" font-size="13" text-anchor="middle" fill="#3d2a00">Isolement et contention</text><text x="300.0" y="332.7" font-size="13" text-anchor="middle" fill="#3d2a00">en cours ensemble ?</text><path d="M300.0,220.0 L300.0,260.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="244.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><rect x="540.0" y="245.0" width="320" height="150" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="275.8" font-size="13" text-anchor="middle" fill="#37403c" font-weight="700">Pause de la contention : l’agent</text><text x="700.0" y="292.1" font-size="13" text-anchor="middle" fill="#37403c">précise « contention seule »</text><text x="700.0" y="308.3" font-size="13" text-anchor="middle" fill="#37403c">ou « isolement aussi » ;</text><text x="700.0" y="324.6" font-size="13" text-anchor="middle" fill="#37403c" font-weight="700">pause de l’isolement : contention</text><text x="700.0" y="340.8" font-size="13" text-anchor="middle" fill="#37403c">mise en pause aussi (case cochée</text><text x="700.0" y="357.1" font-size="13" text-anchor="middle" fill="#37403c">par défaut ; option : pause de</text><text x="700.0" y="373.3" font-size="13" text-anchor="middle" fill="#37403c">l’isolement seul interdite)</text><path d="M470.0,320.0 L540.0,320.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="505.0" y="315.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="90.0" y="427.0" width="420" height="96" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="300.0" y="455.2" font-size="13" text-anchor="middle" fill="#1d2320">Pause enregistrée : début, reprise prévue,</text><text x="300.0" y="471.4" font-size="13" text-anchor="middle" fill="#1d2320">motif, psychiatre ;</text><text x="300.0" y="487.7" font-size="13" text-anchor="middle" fill="#1d2320" font-weight="700">la mesure continue pour le juge</text><text x="300.0" y="503.9" font-size="13" text-anchor="middle" fill="#1d2320">(au registre : fin de l’entrée en cours)</text><path d="M300.0,380.0 L300.0,427.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="407.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><path d="M700.0,395.0 L700.0,420.0 L320.0,420.0 L320.0,429.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="300,555.0 450.0,610 300,665.0 150.0,610" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="606.4" font-size="13" text-anchor="middle" fill="#3d2a00">Le psychiatre</text><text x="300.0" y="622.7" font-size="13" text-anchor="middle" fill="#3d2a00">reprend la mesure ?</text><path d="M300.0,523.0 L300.0,555.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="569.0" width="300" height="82" rx="4" fill="#fbebeb" stroke="#a3261e" stroke-width="1.6"/><text x="700.0" y="598.3" font-size="13" text-anchor="middle" fill="#5c120d">Fin de la mesure ;</text><text x="700.0" y="614.5" font-size="13" text-anchor="middle" fill="#5c120d">date proposée = début</text><text x="700.0" y="630.8" font-size="13" text-anchor="middle" fill="#5c120d">de la pause</text><path d="M450.0,610.0 L550.0,610.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="500.0" y="605.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><polygon points="300,705.0 450.0,760 300,815.0 150.0,760" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="764.5" font-size="13" text-anchor="middle" fill="#3d2a00">Reprise saisie ?</text><path d="M300.0,665.0 L300.0,705.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="689.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><rect x="540.0" y="710.0" width="320" height="100" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="740.2" font-size="13" text-anchor="middle" fill="#37403c">Pause en cours : déduite au plus</text><text x="700.0" y="756.4" font-size="13" text-anchor="middle" fill="#37403c">jusqu’à l’heure de reprise prévue</text><text x="700.0" y="772.7" font-size="13" text-anchor="middle" fill="#37403c">(reprise automatique à cette</text><text x="700.0" y="788.9" font-size="13" text-anchor="middle" fill="#37403c">heure : option, désactivée)</text><path d="M450.0,760.0 L540.0,760.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="495.0" y="755.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">non</text><polygon points="300,850.0 460.0,905 300,960.0 140.0,905" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="901.4" font-size="13" text-anchor="middle" fill="#3d2a00">Réglage des pauses</text><text x="300.0" y="917.7" font-size="13" text-anchor="middle" fill="#3d2a00">de l’établissement</text><path d="M300.0,815.0 L300.0,850.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="836.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">oui</text><path d="M700.0,810.0 L700.0,850.0 L320.0,850.0 L320.0,850.1" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="15.0" y="1000.0" width="250" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="140.0" y="1031.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">Comptées (défaut)</text><text x="140.0" y="1046.7" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">aucune échéance ne bouge</text><rect x="315.0" y="1000.0" width="290" height="70" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="460.0" y="1024.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">Déduites des délais du juge</text><text x="460.0" y="1039.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">cumul diminué,</text><text x="460.0" y="1054.2" font-size="12" text-anchor="middle" fill="#123d24" font-weight="700">échéances reportées</text><rect x="630.0" y="945.0" width="260" height="110" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="760.0" y="981.7" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">Registre et statistiques</text><text x="760.0" y="996.7" font-size="12" text-anchor="middle" fill="#37403c">dans tous les cas : la pause</text><text x="760.0" y="1011.7" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">arrête l’entrée, la reprise</text><text x="760.0" y="1026.7" font-size="12" text-anchor="middle" fill="#37403c" font-weight="700">en ouvre une nouvelle</text><path d="M140.0,905.0 L140.0,905.0 L140.0,1000.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><path d="M300.0,960.0 L300.0,980.0 L460.0,980.0 L460.0,1000.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><path d="M460.0,905.0 L760.0,905.0 L760.0,945.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/></svg>
