"405.0" y="45.0" width="15.0" height="22.0" rx="0" fill="#ffffff" stroke="#5b8fd6" stroke-width="1.2"/><text x="215.0" y="60.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700">Isolement en CSI</text><rect x="285.0" y="80.0" width="90.0" height="22.0" rx="3" fill="#c0504d"/><rect x="315.0" y="80.0" width="15.0" height="22.0" rx="0" fill="#ffffff" stroke="#c0504d" stroke-width="1.2"/><text x="215.0" y="95.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700">Contentions en CSI</text><rect x="495.0" y="80.0" width="60.0" height="22.0" rx="3" fill="#c0504d"/><text x="215.0" y="95.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700"></text><text x="352.5" y="94.8" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text><text x="525.0" y="94.8" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text><text x="322.5" y="119.5" font-size="10" text-anchor="middle" fill="#a3261e">pause de la contention seule (14 h – 15 h)</text><text x="412.5" y="41.5" font-size="10" text-anchor="middle" fill="#2e5c9e">pause de l’isolement (20 h – 21 h)</text><text x="215.0" y="168.0" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">Registre : pauses comptées</text><text x="215.0" y="181.7" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">ou déduites des délais du juge</text><rect x="226.0" y="160.0" width="58.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="255.0" y="174.8" font-size="11" text-anchor="middle" fill="#1d2320">A1 · 4 h</text><rect x="286.0" y="160.0" width="88.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><text x="330.0" y="174.8" font-size="11" text-anchor="middle" fill="#1d2320">C2 · 6 h</text><rect x="376.0" y="160.0" width="118.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="435.0" y="174.8" font-size="11" text-anchor="middle" fill="#1d2320">A3 · 8 h<