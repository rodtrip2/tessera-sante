<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Exemple : isolement avec contentions et pauses, entrées du registre"><title>Exemple : isolement avec contentions et pauses, entrées du registre</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="1000" height="340" fill="#ffffff"/><line x1="225.0" y1="28.0" x2="225.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="225.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">lun 8 h</text><line x1="285.0" y1="28.0" x2="285.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="285.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">12 h</text><line x1="375.0" y1="28.0" x2="375.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="375.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">18 h</text><line x1="465.0" y1="28.0" x2="465.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="465.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">mar 0 h</text><line x1="555.0" y1="28.0" x2="555.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="555.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">6 h</text><line x1="645.0" y1="28.0" x2="645.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="645.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">12 h</text><line x1="825.0" y1="28.0" x2="825.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="825.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">mer 0 h</text><line x1="975.0" y1="28.0" x2="975.0" y2="200.0" stroke="#e2e6e3" stroke-width="1"/><text x="975.0" y="21.9" font-size="11" text-anchor="middle" fill="#4b5651">10 h</text><rect x="225.0" y="45.0" width="750.0" height="22.0" rx="3" fill="#5b8fd6"/><rect x="405.0" y="45.0" width="15.0" height="22.0" rx="0" fill="#ffffff" stroke="#5b8fd6" stroke-width="1.2"/><text x="215.0" y="60.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700">Isolement en CSI</text><rect x="285.0" y="80.0" width="90.0" height="22.0" rx="3" fill="#c0504d"/><rect x="315.0" y="80.0" width="15.0" height="22.0" rx="0" fill="#ffffff" stroke="#c0504d" stroke-width="1.2"/><text x="215.0" y="95.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700">Contentions en CSI</text><rect x="495.0" y="80.0" width="60.0" height="22.0" rx="3" fill="#c0504d"/><text x="215.0" y="95.2" font-size="12" text-anchor="end" fill="#1d2320" font-weight="700"></text><text x="352.5" y="94.8" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text><text x="525.0" y="94.8" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text><text x="322.5" y="119.5" font-size="10" text-anchor="middle" fill="#a3261e">pause de la contention seule (14 h – 15 h)</text><text x="412.5" y="41.5" font-size="10" text-anchor="middle" fill="#2e5c9e">pause de l’isolement (20 h – 21 h)</text><text x="215.0" y="178.0" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">Registre, quel que soit</text><text x="215.0" y="191.7" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">le réglage des pauses</text><rect x="226.0" y="170.0" width="58.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="255.0" y="184.8" font-size="11" text-anchor="middle" fill="#1d2320">A1 · 4 h</text><rect x="286.0" y="170.0" width="28.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><line x1="300.0" y1="192.0" x2="300.0" y2="200.0" stroke="#8a948f" stroke-width="1"/><text x="300.0" y="209.5" font-size="10" text-anchor="middle" fill="#1d2320">C2 · 2 h</text><rect x="316.0" y="170.0" width="13.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><line x1="322.5" y1="192.0" x2="322.5" y2="214.0" stroke="#8a948f" stroke-width="1"/><text x="322.5" y="223.5" font-size="10" text-anchor="middle" fill="#1d2320">A3 · 1 h</text><rect x="331.0" y="170.0" width="43.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><line x1="352.5" y1="192.0" x2="352.5" y2="200.0" stroke="#8a948f" stroke-width="1"/><text x="352.5" y="209.5" font-size="10" text-anchor="middle" fill="#1d2320">C4 · 3 h</text><rect x="376.0" y="170.0" width="28.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><line x1="390.0" y1="192.0" x2="390.0" y2="214.0" stroke="#8a948f" stroke-width="1"/><text x="390.0" y="223.5" font-size="10" text-anchor="middle" fill="#1d2320">A5 · 2 h</text><rect x="421.0" y="170.0" width="73.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="457.5" y="184.8" font-size="11" text-anchor="middle" fill="#1d2320">A6 · 5 h</text><rect x="496.0" y="170.0" width="58.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><text x="525.0" y="184.8" font-size="11" text-anchor="middle" fill="#1d2320">C7 · 4 h</text><rect x="556.0" y="170.0" width="418.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="765.0" y="184.8" font-size="11" text-anchor="middle" fill="#1d2320">A8 · 28 h</text><text x="20.0" y="265.1" font-size="11" text-anchor="start" fill="#37403c">Durées en heures, telles qu’inscrites au registre (exemple fictif, lundi 8 h → mercredi 10 h). Numéros dans l’ordre d’apparition.</text><text x="20.0" y="278.9" font-size="11" text-anchor="start" fill="#37403c">Chaque pause arrête l’entrée : la pause de la contention seule (14 h – 15 h) est de l’isolement seul (A3), la contention reprend en C4 ;</text><text x="20.0" y="292.6" font-size="11" text-anchor="start" fill="#37403c">la pause de l’isolement (20 h – 21 h) ne forme aucune entrée et l’isolement reprend en A6. Total : 49 h.</text></svg>
