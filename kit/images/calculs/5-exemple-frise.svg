 font-size="11" text-anchor="middle" fill="#1d2320">A6 · 28 h</text><text x="215.0" y="321.1" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">Pauses déduites partout,</text><text x="215.0" y="334.9" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">pause de la contention seule</text><text x="215.0" y="348.6" font-size="11" text-anchor="end" fill="#1d2320" font-weight="700">« dans l’entrée C »</text><rect x="226.0" y="320.0" width="58.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="255.0" y="334.9" font-size="11" text-anchor="middle" fill="#1d2320">A1 · 4 h</text><rect x="286.0" y="320.0" width="88.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><text x="330.0" y="334.9" font-size="11" text-anchor="middle" fill="#1d2320">C2 · 6 h</text><rect x="376.0" y="320.0" width="118.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="435.0" y="334.9" font-size="11" text-anchor="middle" fill="#1d2320">A3 · 7 h</text><rect x="496.0" y="320.0" width="58.0" height="22.0" rx="3" fill="#f6dcdb" stroke="#8a948f" stroke-width="1.2"/><text x="525.0" y="334.9" font-size="11" text-anchor="middle" fill="#1d2320">C4 · 4 h</text><rect x="556.0" y="320.0" width="418.0" height="22.0" rx="3" fill="#dbe7f7" stroke="#8a948f" stroke-width="1.2"/><text x="765.0" y="334.9" font-size="11" text-anchor="middle" fill="#1d2320">A5 · 28 h</text><text x="20.0" y="395.1" font-size="11" text-anchor="start" fill="#37403c">Durées en heures, telles qu’inscrites au registre (exemple fictif, lundi 8 h → mercredi 10 h).</text><text x="20.0" y="408.9" font-size="11" text-anchor="start" fill="#37403c">Ligne 2 : C3 (5 h) couvre 12 h – 18 h ; sa pause de 14 h à 15 h devient l’entrée A2 (1 h). A4 : 8 h moins la pause de l’isolement.</text><text x="20.0" y="422.6" font-size="11" text-anchor="start" fill="#37403c">Ligne 3 : la pause de la contention seule reste dans C2, sans déduction (6 h) ; seule une pause commune serait déduite.</text></svg>
