<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1010" width="900" height="1010" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="Cumul et échéances du premier cycle"><title>Cumul et échéances du premier cycle</title><defs><marker id="pointe" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4b5651"/></marker></defs><rect width="900" height="1010" fill="#ffffff"/><rect x="135.0" y="15.0" width="330" height="50" rx="14" fill="#ffffff" stroke="#1f5f5b" stroke-width="1.6"/><text x="300.0" y="36.4" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">Début de la mesure</text><text x="300.0" y="52.7" font-size="13" text-anchor="middle" fill="#1f5f5b" font-weight="700">(décision du psychiatre)</text><rect x="100.0" y="99.0" width="400" height="82" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="300.0" y="120.2" font-size="13" text-anchor="middle" fill="#1d2320">Cumul des 15 jours précédant le début :</text><text x="300.0" y="136.4" font-size="13" text-anchor="middle" fill="#1d2320">mesures du même type du patient</text><text x="300.0" y="152.7" font-size="13" text-anchor="middle" fill="#1d2320">(isolement et contention comptés à part),</text><text x="300.0" y="168.9" font-size="13" text-anchor="middle" fill="#1d2320">périodes qui se chevauchent comptées une fois</text><path d="M300.0,65.0 L300.0,99.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="300,220.0 450.0,270 300,320.0 150.0,270" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="266.4" font-size="13" text-anchor="middle" fill="#3d2a00">Mainlevée par le juge</text><text x="300.0" y="282.7" font-size="13" text-anchor="middle" fill="#3d2a00">dans ces 15 jours ?</text><path d="M300.0,181.0 L300.0,220.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="238.0" width="300" height="64" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="266.4" font-size="13" text-anchor="middle" fill="#37403c">Cumul compté seulement après</text><text x="700.0" y="282.7" font-size="13" text-anchor="middle" fill="#37403c">la fin de la mesure levée</text><path d="M450.0,270.0 L550.0,270.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="500.0" y="265.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><polygon points="300,360.0 450.0,410 300,460.0 150.0,410" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="406.4" font-size="13" text-anchor="middle" fill="#3d2a00">Pauses déduites</text><text x="300.0" y="422.7" font-size="13" text-anchor="middle" fill="#3d2a00">(réglage de l’établissement) ?</text><path d="M300.0,320.0 L300.0,360.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="344.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><path d="M700.0,302.0 L700.0,340.0 L320.0,340.0 L320.0,375.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="378.0" width="300" height="64" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="406.4" font-size="13" text-anchor="middle" fill="#37403c">Durée des pauses passées</text><text x="700.0" y="422.7" font-size="13" text-anchor="middle" fill="#37403c">retirée du cumul</text><path d="M450.0,410.0 L550.0,410.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="500.0" y="405.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="90.0" y="510.0" width="420" height="100" rx="4" fill="#ffffff" stroke="#6b7a75" stroke-width="1.6"/><text x="300.0" y="540.2" font-size="13" text-anchor="middle" fill="#1d2320" font-weight="700">Échéance = début + (seuil − cumul)</text><text x="300.0" y="556.4" font-size="13" text-anchor="middle" fill="#1d2320">jamais avant le début de la mesure</text><text x="300.0" y="572.7" font-size="13" text-anchor="middle" fill="#1d2320">Isolement : information 48 h, saisine 72 h, décision 96 h</text><text x="300.0" y="588.9" font-size="13" text-anchor="middle" fill="#1d2320">Contention : information 24 h, saisine 48 h, décision 72 h</text><path d="M300.0,460.0 L300.0,510.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="489.2" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><path d="M700.0,442.0 L700.0,485.0 L320.0,485.0 L320.0,510.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><polygon points="300,650.0 450.0,700 300,750.0 150.0,700" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="704.5" font-size="13" text-anchor="middle" fill="#3d2a00">Pauses déduites ?</text><path d="M300.0,610.0 L300.0,650.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="659.0" width="300" height="82" rx="4" fill="#f4f5f2" stroke="#8a948f" stroke-width="1.6" stroke-dasharray="5 4"/><text x="700.0" y="688.3" font-size="13" text-anchor="middle" fill="#37403c">Chaque échéance est reportée</text><text x="700.0" y="704.5" font-size="13" text-anchor="middle" fill="#37403c">de la durée des pauses</text><text x="700.0" y="720.8" font-size="13" text-anchor="middle" fill="#37403c">qui la précèdent</text><path d="M450.0,700.0 L550.0,700.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="500.0" y="695.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><polygon points="300,785.0 470.0,840 300,895.0 130.0,840" fill="#fbefcf" stroke="#875c00" stroke-width="1.6"/><text x="300.0" y="836.4" font-size="13" text-anchor="middle" fill="#3d2a00">Mesure commencée moins de</text><text x="300.0" y="852.7" font-size="13" text-anchor="middle" fill="#3d2a00">48 h après une mainlevée ?</text><path d="M300.0,750.0 L300.0,785.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="771.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><path d="M700.0,741.0 L700.0,775.0 L320.0,775.0 L320.0,787.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><rect x="550.0" y="799.0" width="300" height="82" rx="4" fill="#fbebeb" stroke="#a3261e" stroke-width="1.6"/><text x="700.0" y="828.3" font-size="13" text-anchor="middle" fill="#5c120d">Information du juge sans délai</text><text x="700.0" y="844.5" font-size="13" text-anchor="middle" fill="#5c120d">(échéance ramenée au début ;</text><text x="700.0" y="860.8" font-size="13" text-anchor="middle" fill="#5c120d">réglage activé par défaut)</text><path d="M470.0,840.0 L550.0,840.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="510.0" y="835.2" font-size="12" text-anchor="middle" fill="#4b5651" font-weight="700">oui</text><rect x="100.0" y="940.0" width="400" height="56" rx="14" fill="#dff0e5" stroke="#276b43" stroke-width="1.6"/><text x="300.0" y="964.4" font-size="13" text-anchor="middle" fill="#123d24" font-weight="700">Échéances du cycle 1 :</text><text x="300.0" y="980.7" font-size="13" text-anchor="middle" fill="#123d24" font-weight="700">information, saisine, décision du juge</text><path d="M300.0,895.0 L300.0,940.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/><text x="308.0" y="921.7" font-size="12" text-anchor="start" fill="#4b5651" font-weight="700">non</text><path d="M700.0,881.0 L700.0,968.0 L500.0,968.0" fill="none" stroke="#4b5651" stroke-width="1.5" marker-end="url(#pointe)"/></svg>
