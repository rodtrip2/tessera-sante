# SPDX-License-Identifier: EUPL-1.2
# Tests de chaque branche et de chaque demande de fusion (0.74.0, constat S2 de l'audit du 15 novembre 2026).
# La branche main est testée par le flux de publication (pages.yml), où les tests sont bloquants.
name: Tests

on:
  push:
    branches-ignore: [main, stable, beta]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: 20
      - name: Tests unitaires
        run: npm test
      - name: Empreintes de l’application à jour
        run: |
          node scripts/empreintes.mjs
          git diff --exit-code -- app/EMPREINTES-SHA256.txt
