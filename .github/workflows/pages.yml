# SPDX-License-Identifier: EUPL-1.2
# Publication des trois versions sur GitHub Pages (demande du porteur du 13 novembre 2026, lot H) :
#   …/            version stable : branche « stable » (décision du porteur du 15 novembre 2026 : poussée par Claude sur
#                 demande du porteur, commits signés) ou dernière étiquette vX.Y.Z, la plus récente des deux
#   …/beta/       version bêta : branche « beta » ou dernière étiquette vX.Y.Z-beta.N, si elle est plus récente que la
#                 stable, sinon la stable
# Les branches « stable » et « beta » ne sont retenues que si elles pointent sur un commit de main (aucun contenu à part).
#   …/dev/        version de développement : état de la branche main, republié à chaque envoi
# Aucune étape de construction : chaque version est la copie de son état du dépôt.
#
# Garde-fous (0.74.0, constat S2 de l'audit du 15 novembre 2026) :
#   - rien n'est publié si les tests échouent ou si les empreintes ne décrivent pas l'application ;
#   - une version stable ou bêta n'est retenue que si son commit porte une signature vérifiée par GitHub ;
#   - quand la version stable ou bêta change, la publication attend l'approbation du porteur (environnement
#     « publication-stable » : Settings → Environments → publication-stable → Required reviewers, à régler une fois
#     par le porteur ; sans ce réglage, l'étape passe et le signale) ;
#   - les actions sont désignées par l'empreinte de leur commit (une étiquette peut être déplacée), les droits du
#     jeton sont donnés tâche par tâche.
#
# Mise en service (une seule fois, par le porteur) : Settings → Pages → Source « GitHub Actions », puis
# Settings → Secrets and variables → Actions → Variables : PAGES_TROIS_VERSIONS = oui.
# Tant que la variable n'existe pas, ce flux ne fait rien et la publication actuelle (branche main) continue.
name: Publication des versions (GitHub Pages)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Tests et empreintes : bloquants pour toute publication
  tests:
    if: ${{ vars.PAGES_TROIS_VERSIONS == 'oui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Tests unitaires
        run: npm test
      - name: Empreintes de l’application à jour
        run: |
          node scripts/empreintes.mjs
          git diff --exit-code -- app/EMPREINTES-SHA256.txt

  assembler:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      changement: ${{ steps.versions.outputs.changement }}
      resume: ${{ steps.versions.outputs.resume }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assembler les trois versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          dev=$(git rev-parse origin/main)
          # Version d’un état du dépôt (app/js/version.js), vide si illisible
          ver() { git show "$1:app/js/version.js" 2>/dev/null | sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" | head -1 || true; }
          plus_recent() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          # Branche retenue seulement si son commit appartient à main
          branche() { if git rev-parse -q --verify "origin/$1" >/dev/null && git merge-base --is-ancestor "origin/$1" "$dev"; then git rev-parse "origin/$1"; fi; }
          stable=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          bs=$(branche stable)
          if [ -n "$bs" ] && { [ -z "$stable" ] || plus_recent "$(ver "$bs")" "$(ver "$stable")"; }; then stable="$bs"; fi
          [ -n "$stable" ] || stable="$dev"          # aucune version stable : la racine reste l'état de main
          beta=$(git tag -l 'v*-beta.*' --sort=-v:refname | head -1 || true)
          bb=$(branche beta)
          if [ -n "$bb" ] && { [ -z "$beta" ] || plus_recent "$(ver "$bb")" "$(ver "$beta")"; }; then beta="$bb"; fi
          # Bêta retenue seulement si elle est plus récente que la stable
          if [ -z "$beta" ] || [ "$(ver "$beta")" = "$(ver "$stable")" ] || ! plus_recent "$(ver "$beta")" "$(ver "$stable")"; then beta="$stable"; fi
          # Signature vérifiée par GitHub exigée pour la version stable et la version bêta
          signe() { [ "$(gh api "repos/$DEPOT/commits/$(git rev-parse "$1^{commit}")" --jq '.commit.verification.verified')" = "true" ]; }
          for v in "$stable" "$beta"; do
            [ "$(git rev-parse "$v^{commit}")" = "$dev" ] && continue
            signe "$v" || { echo "::error::Le commit de la version $(ver "$v") ($v) n'a pas de signature vérifiée : publication refusée."; exit 1; }
          done
          resume="Stable : $(ver "$stable") ($(git rev-parse --short "$stable^{commit}")) ; bêta : $(ver "$beta") ($(git rev-parse --short "$beta^{commit}")) ; développement : $(ver "$dev") ($(git rev-parse --short "$dev"))"
          echo "$resume"
          # La version stable ou bêta change-t-elle par rapport au site publié ? (site illisible : oui, par prudence)
          publie=$(curl -fsS --max-time 20 "$SITE/versions-publiees.txt" || true)
          attendu_s="stable=$stable $(ver "$stable")"; attendu_b="beta=$beta $(ver "$beta")"
          if grep -qxF "$attendu_s" <<< "$publie" && grep -qxF "$attendu_b" <<< "$publie"; then changement=non; else changement=oui; fi
          echo "changement=$changement" >> "$GITHUB_OUTPUT"
          echo "resume=$resume" >> "$GITHUB_OUTPUT"
          echo "### Versions à publier" >> "$GITHUB_STEP_SUMMARY"; echo "$resume" >> "$GITHUB_STEP_SUMMARY"
          echo "Version stable ou bêta modifiée : $changement" >> "$GITHUB_STEP_SUMMARY"
          rm -rf _site && mkdir -p _site/beta _site/dev
          git archive "$stable" | tar -x -C _site
          git archive "$beta" app index.html | tar -x -C _site/beta
          git archive "$dev" app index.html | tar -x -C _site/dev
          rm -rf _site/.github _site/tests _site/scripts
          touch _site/.nojekyll
          printf 'stable=%s %s\nbeta=%s %s\ndev=%s %s\n' "$stable" "$(ver "$stable")" "$beta" "$(ver "$beta")" "$dev" "$(ver "$dev")" > _site/versions-publiees.txt
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d   # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9   # v5.0.0
        with:
          path: _site
          include-hidden-files: true   # garde .nojekyll (exclu par défaut depuis la v4)

  # Version stable ou bêta modifiée : approbation du porteur (relecteur obligatoire de l'environnement)
  approbation:
    needs: assembler
    if: ${{ needs.assembler.outputs.changement == 'oui' }}
    runs-on: ubuntu-latest
    environment:
      name: publication-stable
    steps:
      - name: Publication approuvée
        env:
          RESUME: ${{ needs.assembler.outputs.resume }}
        run: echo "Publication approuvée — $RESUME"

  # Publication dans une tâche à part (modèle de GitHub) : le site assemblé n'est lisible qu'une fois la tâche
  # précédente terminée
  publier:
    needs: [assembler, approbation]
    if: ${{ always() && needs.assembler.result == 'success' && (needs.approbation.result == 'success' || needs.approbation.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346   # v5.0.1
