# SPDX-License-Identifier: EUPL-1.2
# Publication des trois versions sur GitHub Pages (demande du porteur du 13 novembre 2026, lot H) :
#   …/            version stable : branche « stable » (décision du porteur du 15 novembre 2026 : poussée par Claude sur
#                 demande du porteur, commits signés) ou dernière étiquette vX.Y.Z, la plus récente des deux
#   …/beta/       version bêta : branche « beta » ou dernière étiquette vX.Y.Z-beta.N, si elle est plus récente que la
#                 stable, sinon la stable
# Les branches « stable » et « beta » ne sont retenues que si elles pointent sur un commit de main (aucun contenu à part).
#   …/dev/        version de développement : état de la branche main, republié à chaque envoi
# Aucune étape de construction : chaque version est la copie de son état du dépôt.
#
# Mise en service (une seule fois, par le porteur) : Settings → Pages → Source « GitHub Actions », puis
# Settings → Secrets and variables → Actions → Variables : PAGES_TROIS_VERSIONS = oui.
# Tant que la variable n'existe pas, ce flux ne fait rien et la publication actuelle (branche main) continue.
name: Publication des versions (GitHub Pages)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assembler:
    if: ${{ vars.PAGES_TROIS_VERSIONS == 'oui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assembler les trois versions
        run: |
          set -euo pipefail
          git fetch --force --tags origin '+refs/heads/*:refs/remotes/origin/*'
          dev=$(git rev-parse origin/main)
          # Version d’un état du dépôt (app/js/version.js), vide si illisible
          ver() { git show "$1:app/js/version.js" 2>/dev/null | sed -n "s/.*VERSION = '\([^']*\)'.*/\1/p" | head -1 || true; }
          plus_recent() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]; }
          # Branche retenue seulement si son commit appartient à main
          branche() { if git rev-parse -q --verify "origin/$1" >/dev/null && git merge-base --is-ancestor "origin/$1" "$dev"; then git rev-parse "origin/$1"; fi; }
          stable=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          bs=$(branche stable)
          if [ -n "$bs" ] && { [ -z "$stable" ] || plus_recent "$(ver "$bs")" "$(ver "$stable")"; }; then stable="$bs"; fi
          [ -n "$stable" ] || stable="$dev"          # aucune version stable : la racine reste l'état de main
          beta=$(git tag -l 'v*-beta.*' --sort=-v:refname | head -1 || true)
          bb=$(branche beta)
          if [ -n "$bb" ] && { [ -z "$beta" ] || plus_recent "$(ver "$bb")" "$(ver "$beta")"; }; then beta="$bb"; fi
          # Bêta retenue seulement si elle est plus récente que la stable
          if [ -z "$beta" ] || [ "$(ver "$beta")" = "$(ver "$stable")" ] || ! plus_recent "$(ver "$beta")" "$(ver "$stable")"; then beta="$stable"; fi
          echo "Stable : $stable ($(ver "$stable")) ; bêta : $beta ($(ver "$beta")) ; développement : $dev ($(ver "$dev"))"
          rm -rf _site && mkdir -p _site/beta _site/dev
          git archive "$stable" | tar -x -C _site
          git archive "$beta" app index.html | tar -x -C _site/beta
          git archive "$dev" app index.html | tar -x -C _site/dev
          rm -rf _site/.github _site/tests _site/scripts
          touch _site/.nojekyll
          printf 'stable=%s %s\nbeta=%s %s\ndev=%s %s\n' "$stable" "$(ver "$stable")" "$beta" "$(ver "$beta")" "$dev" "$(ver "$dev")" > _site/versions-publiees.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # Publication dans une tâche à part (modèle de GitHub) : le site assemblé n'est lisible qu'une fois la tâche
  # précédente terminée
  publier:
    needs: assembler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
